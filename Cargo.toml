[package]
name = "fraud-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fraud-api"
path = "src/main.rs"

[[bin]]
name = "build-index"
path = "src/bin/build_index.rs"

[dependencies]
# HTTP server — mais rápido em benchmarks TechEmpower
actix-web = { version = "4", features = ["macros"] }
actix-rt = "2"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gzip para descompactar references.json.gz
flate2 = "1"

# Paralelismo controlado
rayon = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilitários
anyhow = "1"
bytes = "1"

# Zero-copy byte casting para layout binário do índice
bytemuck = { version = "1", features = ["derive"] }

# RNG para K-means++ initialização
rand = "0.9"

# mmap read-only compartilhado entre as duas instâncias de API
memmap2 = "0.9"

# Número de CPUs lógicas para configurar workers do Actix
num_cpus = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
