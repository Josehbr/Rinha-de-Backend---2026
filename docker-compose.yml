services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "20MB"

  api1:
    image: fraud-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: on-failure
    volumes:
      - sockets:/sockets
    environment:
      - RUST_LOG=warn
      - BIND_UDS=/sockets/api1.sock
    ulimits:
      # Allow mlockall + MAP_POPULATE on the 84MB index without EAGAIN.
      # Best-effort: if the Rinha bot strips this, the API still boots
      # (mlockall is a let _ = ... no-op on failure).
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "/bin/busybox", "test", "-S", "/sockets/api1.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"

  api2:
    image: fraud-api:latest
    restart: on-failure
    volumes:
      - sockets:/sockets
    environment:
      - RUST_LOG=warn
      - BIND_UDS=/sockets/api2.sock
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "/bin/busybox", "test", "-S", "/sockets/api2.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

# Totais: 1.0 CPU, 350 MB — dentro do limite da Rinha
