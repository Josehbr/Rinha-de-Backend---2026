services:
  lb:
    image: fraud-api:latest
    # The lb binary lives in the same image as the API; we just override the
    # command to run /app/fraud-lb instead of /app/fraud-api.
    command: ["./fraud-lb"]
    environment:
      - RUST_LOG=warn
      - LB_LISTEN=0.0.0.0:9999
      - LB_API_SOCKS=/sockets/api1.ctrl,/sockets/api2.ctrl
    volumes:
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.16"
          memory: "20MB"

  api1:
    image: fraud-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: on-failure
    volumes:
      - sockets:/sockets
    environment:
      - RUST_LOG=warn
      - CTRL_UDS=/sockets/api1.ctrl
    ulimits:
      # Allow mlockall + MAP_POPULATE on the 84MB index without EAGAIN.
      # Best-effort: if the Rinha bot strips this, the API still boots
      # (mlockall is a let _ = ... no-op on failure).
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "/bin/busybox", "test", "-S", "/sockets/api1.ctrl"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "165MB"

  api2:
    image: fraud-api:latest
    restart: on-failure
    volumes:
      - sockets:/sockets
    environment:
      - RUST_LOG=warn
      - CTRL_UDS=/sockets/api2.ctrl
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "/bin/busybox", "test", "-S", "/sockets/api2.ctrl"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "165MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

# Totais: 1.0 CPU, 350 MB — dentro do limite da Rinha
#   lb   : 0.16 CPU /  20 MB
#   api1 : 0.42 CPU / 165 MB
#   api2 : 0.42 CPU / 165 MB
