services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "20MB"

  api1:
    image: josehbr/fraud-api:v1
    restart: on-failure
    volumes:
      - sockets:/sockets
    environment:
      - RUST_LOG=warn
      - BIND_UDS=/sockets/api1.sock
      - NPROBE=24
      - FULL_NPROBE=72
      - WORKERS=1
    healthcheck:
      test: ["CMD", "/bin/busybox", "test", "-S", "/sockets/api1.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"

  api2:
    image: josehbr/fraud-api:v1
    restart: on-failure
    volumes:
      - sockets:/sockets
    environment:
      - RUST_LOG=warn
      - BIND_UDS=/sockets/api2.sock
      - NPROBE=24
      - FULL_NPROBE=72
      - WORKERS=1
    healthcheck:
      test: ["CMD", "/bin/busybox", "test", "-S", "/sockets/api2.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

# Totais: 1.0 CPU, 340 MB — dentro do limite da Rinha (1.0 CPU, 350 MB)
