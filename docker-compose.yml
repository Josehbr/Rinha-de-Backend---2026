services:
  lb:
    # The image bundles both fraud-api (default CMD) and fraud-lb. We override
    # the command here so the LB process runs instead of the API.
    image: josehbr/fraud-api:v9
    command: ["./fraud-lb"]
    environment:
      - RUST_LOG=warn
      - LB_LISTEN=0.0.0.0:9999
      - LB_API_SOCKS=/sockets/api1.ctrl,/sockets/api2.ctrl
    volumes:
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.16"
          memory: "20MB"

  api1:
    image: josehbr/fraud-api:v9
    restart: on-failure
    volumes:
      - sockets:/sockets
    environment:
      - RUST_LOG=warn
      - CTRL_UDS=/sockets/api1.ctrl
      # SCHED_FIFO wakeup-only: workers spend recv() at FIFO so the kernel
      # wakes them preemptively (skips runqueue wait), then switch to
      # SCHED_OTHER for compute+send so we don't outrank softirqs.
      - RINHA_RT_MODE=wakeup
      # Pin worker threads to a single core to reduce cross-core cache misses.
      - RINHA_CPU=0
    cap_add:
      # Required for sched_setscheduler(SCHED_FIFO). Best-effort: if the Rinha
      # bot strips this, the API still runs (silent fallback to SCHED_OTHER).
      - SYS_NICE
    security_opt:
      # Default Docker seccomp can reject sched_setscheduler from a musl
      # static binary; `unconfined` is what Ronie #2 (p99 0.86ms) uses too.
      - seccomp:unconfined
    ulimits:
      # Allow mlockall + MAP_POPULATE on the 84MB index without EAGAIN.
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "/bin/busybox", "test", "-S", "/sockets/api1.ctrl"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "165MB"

  api2:
    image: josehbr/fraud-api:v9
    restart: on-failure
    volumes:
      - sockets:/sockets
    environment:
      - RUST_LOG=warn
      - CTRL_UDS=/sockets/api2.ctrl
      - RINHA_RT_MODE=wakeup
      - RINHA_CPU=2
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "/bin/busybox", "test", "-S", "/sockets/api2.ctrl"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "165MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

# Totais: 1.0 CPU / 350 MB — dentro do limite da Rinha
#   lb   : 0.16 CPU /  20 MB  (TCP→UDS via SCM_RIGHTS, sem parse de HTTP)
#   api1 : 0.42 CPU / 165 MB  (pthread blocking + SCHED_FIFO wakeup-only)
#   api2 : 0.42 CPU / 165 MB  (pthread blocking + SCHED_FIFO wakeup-only)
